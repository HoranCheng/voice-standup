<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>安装 Siri 快捷指令 — 早会</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: #0a0a0f;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px env(safe-area-inset-bottom);
      gap: 0;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 24px;
      padding: 32px 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .icon { font-size: 64px; line-height: 1; }
    .title { font-size: 22px; font-weight: 800; text-align: center; }
    .subtitle {
      font-size: 14px;
      color: #a1a1aa;
      text-align: center;
      line-height: 1.6;
    }
    .divider {
      width: 100%;
      border: none;
      border-top: 1px solid #3f3f46;
    }
    .steps {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 14px;
      line-height: 1.5;
      color: #a1a1aa;
    }
    .step-num {
      min-width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(99,102,241,0.2);
      color: #818cf8;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step b { color: #e4e4e7; }
    .btn-primary {
      display: block;
      width: 100%;
      padding: 18px;
      border-radius: 14px;
      border: none;
      background: #6366f1;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      font-family: inherit;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .btn-primary:active { opacity: 0.8; }
    .btn-secondary {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #3f3f46;
      background: transparent;
      color: #a1a1aa;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .note {
      font-size: 12px;
      color: #71717a;
      text-align: center;
      line-height: 1.6;
      padding: 0 4px;
    }
    .note a { color: #818cf8; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(245,158,11,0.15);
      color: #f59e0b;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎙</div>
    <div class="title">早会 · 驾车模式</div>
    <div class="badge">🚗 免手触 · 全程语音</div>
    <p class="subtitle">
      安装后说「嘿 Siri，开始站会」<br>
      点一下屏幕，之后全程免手触
    </p>

    <hr class="divider">

    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div>点击下方按钮，在<b>「快捷指令」App</b> 中打开</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div>点击右上角<b>「添加快捷指令」</b></div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div>点击快捷指令名称旁的 <b>⋯</b>，选<b>「添加到 Siri」</b>，录制「开始站会」</div>
      </div>
      <div class="step">
        <div class="step-num">4</div>
        <div>说 <b>「嘿 Siri，开始站会」</b> 🎉</div>
      </div>
    </div>

    <a class="btn-primary" href="shortcuts://import-shortcut?url=https://horancheng.github.io/voice-standup/%E5%BC%80%E5%A7%8B%E7%AB%99%E4%BC%9A.shortcut&name=%E5%BC%80%E5%A7%8B%E7%AB%99%E4%BC%9A">
      📲 在快捷指令中打开
    </a>
    <a class="btn-secondary" href="./%E5%BC%80%E5%A7%8B%E7%AB%99%E4%BC%9A.shortcut" download>
      ⬇ 直接下载 .shortcut 文件
    </a>

    <p class="note">
      仅支持 iPhone / iPad（iOS 13+）<br>
      <a href="./">← 回到早会 App</a>
    </p>
  </div>
</body>
</html>
